<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 클라이언트 예제</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            background: #ffffff;
            color: #1f2937;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .status {
            padding: 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
        }
        
        .status-dot.connected {
            background: #10b981;
        }
        
        .controls {
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 200px;
        }
        
        .control-group label {
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }
        
        .control-group input {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .chat-container {
            height: 400px;
            display: flex;
            flex-direction: column;
        }
        
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: white;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #f1f5f9;
        }
        
        .message.system {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
        }
        
        .message.user {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .message-sender {
            font-weight: 600;
            color: #374151;
        }
        
        .message-time {
            font-size: 0.8rem;
            color: #6b7280;
        }
        
        .message-content {
            color: #1f2937;
        }
        
        .input-area {
            padding: 20px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        .members-panel {
            padding: 20px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }
        
        .members-title {
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
        }
        
        .member-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .member-tag {
            background: #e0e7ff;
            color: #3730a3;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .source-panel {
            padding: 20px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }
        
        .source-title {
            font-weight: 600;
            color: #374151;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .source-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #4b5563;
        }
        
        .source-content {
            background: white;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-bottom: 15px;
            overflow: hidden;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 600px;
            }
        }
        
        .source-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .source-header h4 {
            margin: 0;
            color: #374151;
            font-size: 1rem;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #6b7280;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .close-btn:hover {
            background: #e5e7eb;
            color: #374151;
        }
        
        .source-code {
            margin: 0;
            padding: 20px;
            background: #1f2937;
            color: #f9fafb;
            font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            max-height: 400px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .source-code code {
            background: none;
            color: inherit;
            padding: 0;
            font-size: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 WebSocket 클라이언트 예제</h1>
            <p>실시간 데이터 통신 테스트</p>
        </div>
        
        <div class="status">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">연결 안됨</span>
            </div>
            <div id="socketId" style="font-size: 0.9rem; color: #6b7280;"></div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label>서버 URL</label>
                <input type="text" id="serverUrl" value="" placeholder="서버 URL을 입력하세요">
            </div>
            <div class="control-group">
                <label>사용자 ID</label>
                <input type="text" id="userId" value="test-user" placeholder="사용자 ID">
            </div>
            <div class="control-group">
                <label>닉네임</label>
                <input type="text" id="nickName" value="테스터" placeholder="닉네임">
            </div>
            <div class="control-group">
                <label>서버 Room 이름</label>
                <input type="text" id="roomName" value="테스트 서버 Room" placeholder="서버 Room 이름">
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="connectBtn">연결</button>
            <button class="btn btn-success" id="createRoomBtn" disabled>서버 Room 생성</button>
            <button class="btn btn-success" id="joinRoomBtn" disabled>서버 Room 입장</button>
            <button class="btn btn-danger" id="leaveRoomBtn" disabled>서버 Room 나가기</button>
            <button class="btn btn-danger" id="disconnectBtn" disabled>연결 해제</button>
            <button class="btn btn-danger" id="cleanRoomsBtn" disabled>모든 서버 Room 정리</button>
        </div>
        
        <div class="chat-container">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." disabled>
                <button class="btn btn-primary" id="sendBtn" disabled>전송</button>
            </div>
        </div>
        
        <!-- Room 목록 패널 추가 -->
        <div class="members-panel">
            <div class="members-title">현재 멤버 (<span id="memberCount">0</span>)</div>
            <div class="member-list" id="memberList"></div>
        </div>
        
        <div class="room-list-panel" style="padding: 20px; background: #f8fafc; border-top: 1px solid #e2e8f0;">
            <div class="members-title">서버 Room 목록</div>
            <div id="roomListPanel"></div>
        </div>
        
        <div class="source-panel">
            <div class="source-title">소스코드 보기</div>
            <div class="source-buttons">
                <button class="btn btn-secondary" id="showHtmlBtn">HTML 소스코드 보기</button>
                <button class="btn btn-secondary" id="showJsBtn">JavaScript 소스코드 보기</button>
            </div>
            
            <div class="source-content" id="htmlSource" style="display: none;">
                <div class="source-header">
                    <h4>📄 example.html</h4>
                    <button class="close-btn" onclick="toggleSource('htmlSource')">&times;</button>
                </div>
                <pre class="source-code"><code id="htmlCodeContent">로딩 중...</code></pre>
            </div>
            
            <div class="source-content" id="jsSource" style="display: none;">
                <div class="source-header">
                    <h4>📄 example.js</h4>
                    <button class="close-btn" onclick="toggleSource('jsSource')">&times;</button>
                </div>
                <pre class="source-code"><code id="jsCodeContent">로딩 중...</code></pre>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script src="example.js"></script>
</body>
</html>
